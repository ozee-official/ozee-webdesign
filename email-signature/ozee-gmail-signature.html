<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ozee – Gmail-Signatur</title>
<style>
  body { margin: 0; padding: 40px 24px; font-family: Arial, Helvetica, sans-serif; background: #f2f2f0; color: #111; }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p.hint { margin: 0 0 20px; font-size: 14px; line-height: 1.5; color: #444; }
  .card { background: #fff; border: 1px solid #ddd; padding: 28px; margin-bottom: 20px; }
  button { font: 700 14px Arial, Helvetica, sans-serif; padding: 12px 22px; background: #f3ef3d; color: #000; border: 0; cursor: pointer; }
  button:hover { background: #000; color: #f3ef3d; }
  #status { margin-left: 12px; font-size: 14px; color: #1a7f37; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Gmail-Signatur kopieren</h1>
  <p class="hint">Auf „Signatur kopieren“ klicken und in Gmail unter Einstellungen → Alle Einstellungen → Allgemein → Signatur einfügen (Strg+V).</p>
  <div class="card">
<!-- SIGNATURE START -->
<div id="sig"><table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:20px;color:#111111;"><tr><td style="padding:0 0 14px 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:20px;color:#111111;">Best regards,<br><b style="font-size:16px;">Ozee</b></td></tr><tr><td style="padding:0 0 12px 0;"><a href="https://ozeemusic.com/"><img src="https://ozeemusic.com/images/signature/logo-badge.png" width="200" height="55" alt="Ozee" border="0" style="display:block;border:0;"></a></td></tr><tr><td style="padding:0 0 12px 0;"><a href="https://open.spotify.com/intl-de/artist/4HCreTyqXNdNXZKMYr4qCX?si=k1KQCrOnQiCeBKHsIFPFkA"><img src="https://ozeemusic.com/images/signature/icon-spotify.png" width="36" height="36" alt="Spotify" border="0" style="border:0;"></a>&nbsp;<a href="https://soundcloud.com/ozeemusic"><img src="https://ozeemusic.com/images/signature/icon-soundcloud.png" width="36" height="36" alt="SoundCloud" border="0" style="border:0;"></a>&nbsp;<a href="https://www.youtube.com/@ozeemusic7198"><img src="https://ozeemusic.com/images/signature/icon-youtube.png" width="36" height="36" alt="YouTube" border="0" style="border:0;"></a>&nbsp;<a href="https://www.instagram.com/_ozeemusic_/"><img src="https://ozeemusic.com/images/signature/icon-instagram.png" width="36" height="36" alt="Instagram" border="0" style="border:0;"></a></td></tr><tr><td style="font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:20px;color:#111111;"><img src="https://ozeemusic.com/images/signature/marker.png" width="20" height="12" alt="" border="0" style="border:0;">&nbsp; <a href="https://ozeemusic.com/" style="color:#111111;font-weight:bold;text-decoration:underline;">ozeemusic.com</a><br><a href="mailto:ozeemusic.contact@gmail.com" style="color:#111111;text-decoration:underline;">ozeemusic.contact@gmail.com</a></td></tr></table></div>
<!-- SIGNATURE END -->
  </div>
  <button id="copy" type="button">Signatur kopieren</button><span id="status" role="status"></span>
</div>
<script>
  document.getElementById('copy').addEventListener('click', function () {
    var node = document.getElementById('sig');
    var range = document.createRange();
    range.selectNode(node);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.getElementById('status').textContent = ok ? 'Kopiert. Jetzt in Gmail einfügen.' : 'Bitte mit Strg+C kopieren (Signatur ist markiert).';
  });
</script>
</body>
</html>
